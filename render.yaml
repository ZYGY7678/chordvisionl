# Render Blueprint for ChordVision (free plan).
# In Render: New > Blueprint > pick this repository > Apply.
services:
  - type: web
    name: chordvision
    runtime: docker
    # Closest Render region to Israel.
    region: frankfurt
    # Free plan: 512 MB RAM and a shared 0.1 CPU, no persistent disk.
    # The recognizer uses bounded-memory HPSS, CQT, onset and RMS blocks.
    # Keep one analysis worker active at a time on the 512 MiB Free instance.
    # The service goes to sleep after 15 minutes
    # without traffic and wakes on the next visit (about a minute).
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    # No "disk:" block on purpose: the free plan does not support one.
    # /data below is an ordinary folder inside the container, so projects
    # and uploaded recordings are wiped whenever the service sleeps,
    # restarts or deploys. The app copes with that: a visitor whose data is
    # gone simply starts with an empty project list.
    envVars:
      # Generated once by Render and then kept. Do not change it afterwards:
      # that signs every user out and makes stored API keys unreadable.
      - key: CHORDVISION_SECRET_KEY
        generateValue: true
      - key: CHORDVISION_ENVIRONMENT
        value: production
      - key: CHORDVISION_STORAGE_DIR
        value: /data/storage
      - key: CHORDVISION_DATABASE_URL
        value: sqlite:////data/chordvision.db
      # One analysis at a time: each one needs a core and a few hundred MB.
      - key: CHORDVISION_ANALYSIS_WORKERS
        value: "1"
      # Hard cap for uploaded audio duration on the Free instance.
      - key: CHORDVISION_MAX_AUDIO_SECONDS
        value: "300"
      - key: CHORDVISION_MAX_UPLOAD_BYTES
        value: "62914560"
